# Calm-fintech theme. Light and dark variants; the browser/OS
# setting picks one. No external fonts or CDNs: works offline.
[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"

[theme]
baseRadius = "0.75rem"
font = "sans-serif"
chartCategoricalColors = ["#0F766E", "#4F46E5", "#D97706", "#DB2777",
                          "#0284C7", "#65A30D", "#7C3AED", "#64748B"]

[theme.light]
primaryColor = "#0F766E"
backgroundColor = "#F6F8FA"
secondaryBackgroundColor = "#E9EEF2"
textColor = "#0F172A"
borderColor = "#D5DDE5"

[theme.dark]
primaryColor = "#2DD4BF"
backgroundColor = "#0B1220"
secondaryBackgroundColor = "#131C2E"
textColor = "#E2E8F0"
borderColor = "#243049"
chartCategoricalColors = ["#2DD4BF", "#818CF8", "#FBBF24", "#F472B6",
                          "#38BDF8", "#A3E635", "#A78BFA", "#94A3B8"]
